<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mileage</title>
<link rel="stylesheet" href="/css/MyPage/mileage.css">
<script defer type="text/javascript" src="/js/MyPage/mileage.js"></script>

</head>
<body>
	<!-- 헤더푸터-->
	<div th:replace="~{header :: header}"></div>

	<h1><span>💰</span> 적립금</br>
	<p class="addressp">적립금은 상품 구매시 사용하실 수 있습니다.</p></h1>
	<main>

		<div class="MileageHeader">
			<div class="firstbox rightline">
				<div class="firstboxspan">
				<span>총적립금</span> 
					<span th:text="${#numbers.formatInteger(total_mileage, 0, 'COMMA').replace(',', '.') + '원'}"></span>
				</div>
				
				<div class="firstboxspan">
					<span>환불예정 적립금</span> <span>0원</span>
				</div>
			</div>
			<div class="firstbox">
				<div class="firstboxspan">
				<span>사용가능 적립금</span> 
					<span th:text="${#numbers.formatInteger(availableMileage, 0, 'COMMA').replace(',', '.') + '원'}"></span>
				</div>
				<div class="firstboxspan">
				<span>사용된 적립금</span> 
					<span th:text="${#numbers.formatInteger(usedMileage, 0, 'COMMA').replace(',', '.') + '원'}"></span>
				</div>
			</div>
		</div>

		<div class="mileagemain">
			<div class="mileagemaintitle">주문 상품 정보</div>
			<div class="mileage_main">
			<div class="mileagecontent_title">
				<span>주문날짜</span> <span>적립금</span> <span>주문번호</span> <span>내용</span>
			</div>
			<div class="mileagecontent" th:if="${currentPage == 1}">
				<!-- MyPage/mileage.html -->
<span th:text="${#temporals.format(mileage_list, 'yyyy-MM-dd')}"></span>


 <span>2,000원</span> <span></span> <span>신규회원 적립금</span>
			</div>
			<div class="mileagecontent" th:each="content:${mileage_all}">
				<span th:text="${#temporals.format(content.createAt, 'yyyy-MM-dd')}"></span>
				<span th:text="${content.mileage} + '원'"></span>
				<span th:text="${content.ordernum}"></span>
				<span th:text="${content.content}"></span>
			</div>
			</div>
		</div>
		
<div class="pagination">
    <!-- 이전 버튼 -->
    <button th:if="${currentPage > 1}"
            th:onclick="'location.href=\'?page=' + (${currentPage} - 1) + '\';'"
            th:classappend="${currentPage == 1} ? 'disabled' : ''">&lt;</button>

    <!-- 페이지 번호 -->
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:classappend="${i + 1 == currentPage} ? 'active' : ''"
          th:onclick="'location.href=\'?page=' + (${i + 1}) + '\';'"
          th:text="${i + 1}"></span>

    <!-- 다음 버튼 -->
    <button th:if="${currentPage < totalPages}"
            th:onclick="'location.href=\'?page=' + (${currentPage} + 1) + '\';'"
            th:classappend="${currentPage == totalPages} ? 'disabled' : ''">&gt;</button>
</div>


		<div class="mileagefooter">
			<div class="mileagenotice">적립금 안내</div>
			<div class="mileagexplane">
				<div>1. 주문으로 발생한 적립금은 즉시 사용하능한 적립금으로 전환됩니다.</div>
				<div>2. 사용가능 적립금은 상품구매시 바로 사용가능합니다.</div>
				<div>3. 적립금 사용 후 반품/환불/취소시 적립금 또한 상환됩니다.</div>
			</div>
		</div>
	</main>



	<div th:replace="~{footer :: footer}"></div>

</body>
</html>
