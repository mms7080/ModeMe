<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>
<link rel="stylesheet" href="/css/MyPage/order.css">
<script defer type="text/javascript" src="/js/MyPage/order.js"></script>
<link rel="icon" type="image/png" sizes="16x16" th:href="@{/image/favicon-s.png}">
</head>
<body>
   <!-- 헤더푸터-->
   <div th:replace="~{header :: header}"></div>

   <h1>
      <span>📜</span> 주문내역 조회 </br>
      <p class="addressp">고객님께서 주문하신 상품의 주문내역을 확인하실수 있습니다.</p>
   </h1>
   <main>
      <div class="OrderHeader">
         <div class="greybox">
            <select class="orderselect" name="searchselectoption">
            <option>전체</option>
               <option>입금전</option>
               <option>배송준비중</option>
               <option>배송중</option>
               <option>배송완료</option>
            </select> <span class="daybuttons">
               <button class="daybutton">오늘</button>
               <button class="daybutton">1주일</button>
               <button class="daybutton">1개월</button>
               <button class="daybutton">3개월</button>
               <button class="daybutton">6개월</button>
            </span>
            <form class="orderheaderform">
            	<input type="hidden" name="searchselect" value="전체"/>
               <input type="date" id="startdate" name="startdate" required>
               ~ <input type="date" id="enddate" name="enddate" required>
               <button class="ordersearch">조회</button>
            </form>
         </div>
      </div>
      <p style="color: grey;">○ 주문내역은 최대 6개월까지만 조회 가능합니다.</p>
      <div class="ordermain">
         <div class="ordermaintitle">주문 상품 정보</div>
         <div class="order_main">
            <div class="ordercontent">
               <span>주문일자<br>[주문번호]</span> 
               <span>이미지</span> 
               <span>상품정보</span> 
               <span>수량</span>
               <span>상품구매금액</span>
               <span>주문처리상태</span>
            </div>

<!-- 주문 내역이 있을 경우 -->
<div th:if="${orders != null && !orders.isEmpty()}">
    <div class="ordercontent online" th:each="content : ${orders}">
        <div class="center">
            <span th:text="${#temporals.format(content['order'].orderDate, 'yyyy-MM-dd')}"></span></br>
            <span th:text="${content['order'].id}"></span>
        </div>
        <!-- 이미지가 있을 경우에만 표시 -->
        <img th:if="${content['imageUrls'] != null and not #lists.isEmpty(content['imageUrls'])}"
             th:src="@{${content['imageUrls'][0]}}" alt="상품 이미지" class="order-image" />

        <a th:href="@{/productDetail/productDetail/{id}(id=${content['order'].productNumber})}">
            <span th:text="${content['order'].itemname}"></span>
            <span th:if="${content['merchantUidCount'] != null and content['merchantUidCount'] > 0}" 
                  th:text="' 외 ' + ${content['merchantUidCount']} + '개'">
            </span>
        </a>
        <span th:text="${content['order'].productMany}"></span> 
        <span th:text="${#numbers.formatInteger(content['order'].totalPrice, 0, 'COMMA').replace(',', '.')}"></span> 
        <span th:switch="${content['order'].process}"> 
            <span th:case="'before'">⏰ 입금 전</span> 
            <span th:case="'ready'">📦 배송준비 중</span>
            <span th:case="'delivery'">🚛 배송 중</span> 
            <span th:case="'done'">✅ 배송완료</span>
            <span th:case="*">기타</span> <!-- 예상치 못한 값 처리 -->
        </span>
    </div>
</div>


<!-- 주문 내역이 없을 경우 -->
<div th:unless="${orders != null && !orders.isEmpty()}" class="orderlist">
    <div class="order_null">주문 내역이 없습니다.</div>
</div>

         </div>
<!-- 🚀 totalPages가 0이면 페이지네이션을 표시하지 않음 -->
<div class="pagination" th:if="${totalPages > 1}">
    <!-- 이전 버튼 -->
    <button th:if="${currentPage > 1}"
            th:onclick="|goToPage(${currentPage - 1})|"
            th:classappend="${currentPage == 1} ? 'disabled' : ''">&lt;</button>

    <!-- 페이지 번호 -->
    <span th:each="i : ${#numbers.sequence(1, totalPages)}"
          th:classappend="${i == currentPage} ? 'active' : ''"
          th:onclick="|goToPage(${i})|"
          th:text="${i}"></span>

    <!-- 다음 버튼 -->
    <button th:if="${currentPage < totalPages}"
            th:onclick="|goToPage(${currentPage + 1})|"
            th:classappend="${currentPage == totalPages} ? 'disabled' : ''">&gt;</button>
</div>


   </main>

   <div th:replace="~{footer :: footer}"></div>

</body>
</html>
