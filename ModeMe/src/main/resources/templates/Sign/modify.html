<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정</title>
    <link rel="stylesheet" href="/css/Sign/modify.css">
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/image/favicon-s.png}">
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{header :: header}"></div>

    <!-- 본문 -->
    <main class="modify-container">
        <div class="breadcrumb">
            <a href="/">홈</a> &gt; <span>회원정보 수정</span>
        </div>
        <h1>👨‍👩‍👦 회원정보 수정</h1>
        <form action="/modify" method="post" class="modify-form">
            <!-- 기본정보 -->
            <fieldset>
                <legend>기본정보</legend>
                <div class="form-row">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" th:value="${userDTO.username}" readonly>
                </div>
				<div class="form-row">
				    <label for="password">비밀번호 변경</label>
				    <input type="password" id="password" name="password" placeholder="새 비밀번호 입력 (변경하지 않으려면 비워두세요)">
				    <small id="password-strength-status"></small>
				</div>
				
				<div class="form-row">
				    <label for="confirm-password">비밀번호 확인</label>
				    <input type="password" id="confirm-password" placeholder="비밀번호를 다시 입력하세요">
				    <small id="password-match-status"></small>
				</div>
                <div class="form-row">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" th:value="${userDTO.name}" readonly>
                </div>
                <div class="form-row">
                    <label for="postcode">주소</label>
                    <div class="address-container">
                        <input type="text" id="postcode" name="postcode" th:value="${userDTO.postcode}" placeholder="우편번호" readonly>
                        <button type="button" id="find-address-btn" class="btn-black small-btn" onclick="findAddress()">주소 찾기</button>
                    </div>
                    <input type="text" id="address" name="address" th:value="${userDTO.address}" placeholder="기본 주소" readonly>
                    <input type="text" id="address-detail" name="addressDetail" th:value="${userDTO.addressDetail}" placeholder="상세 주소">
                </div>
            </fieldset>

            <!-- 연락처 -->
            <fieldset>
                <legend>연락처</legend>
                <div class="form-row">
                    <label for="phone">휴대폰 번호</label>
                    <input type="text" id="phone" name="phone" th:value="${userDTO.phone}" placeholder="01012345678" maxlength="11">
                </div>
            </fieldset>

            <!-- 이메일 -->
            <fieldset>
                <legend>이메일</legend>
                <div class="form-row">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" th:value="${userDTO.email}" placeholder="example@domain.com">
                </div>
            </fieldset>

            <!-- 추가정보 -->
            <fieldset>
                <legend>추가정보</legend>
                <div class="form-row">
                    <label for="birthdate">생년월일</label>
                    <input type="date" id="birthdate" name="birthdate" th:value="${userDTO.birthdate}">
                </div>
                <div class="form-row">
                    <label for="gender">성별</label>
                    <select name="gender" id="gender">
                        <option value="" disabled>선택하세요</option>
                        <option value="male" th:selected="${userDTO.gender == 'male'}">남성</option>
                        <option value="female" th:selected="${userDTO.gender == 'female'}">여성</option>
                    </select>
                </div>
            </fieldset>

            <!-- 버튼 -->
            <div class="form-actions">
                <button type="submit" class="btn-save">회원정보 수정</button>
                <button type="reset" class="btn-cancel">취소</button>
            </div>
        </form>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{footer :: footer}"></div>
	    
	<script>
	function findAddress() {
	    new daum.Postcode({
	        oncomplete: function(data) {
	            document.getElementById('postcode').value = data.zonecode;
	            document.getElementById('address').value = data.address;
	        }
	    }).open();
	}
	
	// 비밀번호 실시간 체크
	document.addEventListener("DOMContentLoaded", () => {
	    const pw = document.getElementById("password");
	    const confirm = document.getElementById("confirm-password");
	    const strengthStatus = document.getElementById("password-strength-status");
	    const matchStatus = document.getElementById("password-match-status");
	
	    if (pw && confirm) {
	        pw.addEventListener("input", () => {
	            const value = pw.value.trim();
	            if (value.length < 5) {
	                strengthStatus.innerText = "";
	                strengthStatus.style.color = "";
	            } else if (value.length < 10) {
	                strengthStatus.innerText = "⚠️ 약한 비밀번호입니다. (최소 10자)";
	                strengthStatus.style.color = "orange";
	            } else {
	                strengthStatus.innerText = "✅ 강한 비밀번호입니다!";
	                strengthStatus.style.color = "green";
	            }
	        });
	
	        confirm.addEventListener("input", () => {
	            if (!confirm.value) {
	                matchStatus.innerText = "";
	            } else if (pw.value === confirm.value) {
	                matchStatus.innerText = "✅ 비밀번호가 일치합니다.";
	                matchStatus.style.color = "green";
	            } else {
	                matchStatus.innerText = "❌ 비밀번호가 일치하지 않습니다.";
	                matchStatus.style.color = "red";
	            }
	        });
	    }
	});
	
	// 회원정보 수정 제출 시 유효성 검사 포함
	document.addEventListener("DOMContentLoaded", () => {
	    document.querySelector(".modify-form").addEventListener("submit", function (event) {
	        const pw = document.getElementById("password").value.trim();
	        const confirm = document.getElementById("confirm-password")?.value?.trim();
	
	        // 비밀번호 입력한 경우에만 검사
	        if (pw.length > 0) {
	            if (pw.length < 10) {
	                alert("비밀번호는 10자 이상이어야 합니다.");
	                event.preventDefault();
	                return;
	            }
	
	            if (pw !== confirm) {
	                alert("비밀번호가 일치하지 않습니다.");
	                event.preventDefault();
	                return;
	            }
	        }
	
	        // 통과 시 fetch 요청 진행
	        const formData = new FormData(this);
	        fetch("/modify", {
	            method: "POST",
	            body: formData
	        }).then(response => {
	            if (response.ok) {
	                alert("회원정보가 수정되었습니다.");
	                location.reload();
	            } else {
	                alert("회원정보 수정에 실패했습니다.");
	            }
	        }).catch(error => {
	            console.error("❌ 요청 중 오류:", error);
	            alert("오류가 발생했습니다.");
	        });
	
	        event.preventDefault(); // fetch 후에도 기본 제출 막기
	    });
	});
	</script>
</body>
</html>
