<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModeMe</title>
<link href="css/main.css" rel="stylesheet">
<script src="js/main.js" defer></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="http://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>
<style>
.swiper {
  width: 100%;
  height: 100%;
}

.swiper-slide {
  text-align: center;
  font-size: 18px;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.swiper-slide img {
  display: block;
  width: 200px;
  height: 250px;
  object-fit: cover;
}

/*  상품 카드 기본 스타일 */
.product-card {
    position: relative;
    background: #fff;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
}

/* 상품 이미지 */
.product-card img {
    width: 220px;
    height: 330px;
    object-fit: cover;
    
}

/* 상품명 스타일 */
.product-card p {
    font-size: 15px;
    font-weight: 500;
    margin: 8px 0;
    color: #333;
}

/* 가격 스타일 */
.product-card p:nth-of-type(2) {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

/* 호버 시 부드러운 효과 */
.product-card:hover {
    transform: translateY(-3px);
}

/* 색상 선택점 */
.color-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
}

.color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #ddd;
}


.product-grid p {
	cursor: pointer;
}

</style>
</head>
<body>

	<div th:replace="~{header::header}"></div>

	<section style="width:60%;">
		<h2 class="section-title">Weekly Best</h2>
		<div class="swiper mySwiper">
			<div class="swiper-wrapper">
				<div th:each="p, iterStat : ${aList}" th:if="${iterStat.index < 6}" class="swiper-slide">
					<input type="hidden" th:value="${p.id}">
					<img th:src="${not #lists.isEmpty(p.imageUrls) ? p.imageUrls[0] + '?v=' + #dates.createNow().getTime() : '/image/default.jpg'}" 
     alt="상품 이미지" class="product-image">


				</div>
			</div>
			<div class="swiper-button-next" style="color:black;"></div>
			<div class="swiper-button-prev" style="color:black;"></div>
			<div class="autoplay-progress">
		      <span></span>
		    </div>
		</div>
	</section>



	<!-- thymeleaf 적용된 리스트목록칸 -->
	<section>
		<h2 class="section-title">Items</h2>
		<div class="product-grid">
			<div th:each="p : ${aList}" class="product-card">
				<input type="hidden" th:value="${p.id}">
				<img th:if="${not #lists.isEmpty(p.imageUrls)}"
     th:attr="src=${p.imageUrls[0]},data-timestamp=${#dates.createNow().getTime()}"
     alt="상품 이미지" class="product-image">



				<div class="hover-icons">
					<svg class="heart-icon"
					th:classappend="${wList != null and #lists.contains(wList.![itemNumber], p.id) ? 'filled' : ''}"
					 xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
					</svg>
					<svg class="plus-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path d="M12 5v14m-7-7h14"/>
					</svg>
				</div>
				<p>[[${p.name}]]</p>
				<p>KRW [[${#numbers.formatInteger(p.price, 0, 'COMMA').replace(',', '.')}]]원</p>
				<div class="color-dots">
					<span th:each="colors : ${p.colors}" class="color-dot" th:style="'background-color:' + ${colors}"></span>
				</div>
			</div>
		</div>
	</section>
	
	<div style="height:100px;"></div>

	<div th:replace="~{footer::footer}"></div>
	
	
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<script>
		var swiper = new Swiper(".mySwiper", {
	      spaceBetween: 30,
	      centeredSlides: true,
	      autoplay: {
	        delay: 2500,
	        disableOnInteraction: false,
	      },
	      pagination: {
	        el: ".swiper-pagination",
	        clickable: true,
	      },
	      navigation: {
	        nextEl: ".swiper-button-next",
	        prevEl: ".swiper-button-prev",
	      },
	    });
		
		
	</script>
</body>
</html>
