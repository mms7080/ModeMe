<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Write</title>
<link rel="stylesheet" href="/css/productDetail/reviewWrite.css">
<script defer src="/js/productDetail/productReviewWrite.js"></script>
</head>
<body>
	<!-- 헤더 -->
	<div th:replace="~{header :: header}"></div>
	<div class="review-container">
		<h1>REVIEW</h1>
		<p class="description">상품 사용후기를 작성해주세요.</p>

		<!-- Product Summary -->
		<div class="product-summary">
			<!-- 상품 이미지 -->
			<div class="product-image">
				<img
					th:src="${not #lists.isEmpty(imageUrls) ? imageUrls[0] : '/images/default-product.png'}"
					alt="상품 이미지">

			</div>

			<!-- 상품 정보 -->
			<div class="product-info">
				<h4 th:text="${product?.name ?: '상품 이름 없음'}">상품 이름</h4>
				<p th:if="${product != null and product.price != null}" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></p>
				<p class="product-price" th:if="${product == null or product.price == null}">0원</p>
				<a th:href="@{/productDetail/productDetail/{id}(id=${product?.id})}">
					<button type="button">상품 상세보기</button>
				</a>
			</div>
		</div>

		<!-- Review Form -->
		<form class="review-form" th:action="@{/productDetail/{id}/review(id=${product.id ?: 0})}"
			method="post">

			<!-- 내용 -->
			<label for="content">내용</label>
			<textarea id="content" class="content" name="content" rows="10"
				placeholder="내용을 입력하세요" required></textarea>


			<!-- File Upload -->
			<div class="file-upload">
				<label>사진등록</label>
				<p class="file-limit-message">최대 4장까지 등록 가능합니다.</p>
				<div class="file-input-group">
					<input type="file" id="reviewFile1"> <img
						id="reviewPreview1" src="" alt="미리보기"
						style="display: none; max-width: 100px;"> <input
						type="hidden" id="reviewImageUrl1" name="imageUrls">
				</div>
				<div class="file-input-group">
					<input type="file" id="reviewFile2"> <img
						id="reviewPreview2" src="" alt="미리보기"
						style="display: none; max-width: 100px;"> <input
						type="hidden" id="reviewImageUrl2" name="imageUrls">
				</div>
				<div class="file-input-group">
					<input type="file" id="reviewFile3"> <img
						id="reviewPreview3" src="" alt="미리보기"
						style="display: none; max-width: 100px;"> <input
						type="hidden" id="reviewImageUrl3" name="imageUrls">
				</div>
				<div class="file-input-group">
					<input type="file" id="reviewFile4"> <img
						id="reviewPreview4" src="" alt="미리보기"
						style="display: none; max-width: 100px;"> <input
						type="hidden" id="reviewImageUrl4" name="imageUrls">
				</div>
			</div>

			<!-- Buttons -->
			<div class="form-buttons">
				<!-- CSRF 토큰 추가 -->
				<input type="hidden" name="_csrf" th:value="${_csrf.token}">
				<!-- 등록 버튼 -->
				<button type="submit" class="upload-button">등록</button>
				<!-- 취소 버튼 -->
				<button type="button"
					th:onclick="|location.href='/productDetail/productDetail/${product.id}'|">취소</button>
			</div>
		</form>
	</div>
	<!-- 푸터 -->
	<div th:replace="~{footer :: footer}"></div>
</body>
</html>
